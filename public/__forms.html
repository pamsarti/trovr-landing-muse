<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Netlify form detection</title>
  </head>
  <body>
    <!--
      Hidden static forms so Netlify registers them at build/deploy time.
      The real forms are React-rendered (trip inquiry + homepage newsletter)
      and submit form-encoded POSTs to "/" with a matching `form-name`.
      Every field used by those forms must be declared here for Netlify to
      capture it. This file is never linked or shown to users.
    -->
    <form name="inquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="phone" />
      <input type="text" name="when" />
      <textarea name="about"></textarea>
      <input type="text" name="trip_id" />
      <input type="text" name="trip_name" />
      <input type="text" name="operator" />
      <input type="text" name="source_page" />
      <input type="text" name="bot-field" />
    </form>

    <form name="newsletter" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="email" name="email" />
      <input type="text" name="bot-field" />
    </form>

    <form name="contato-trovr" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="profile" />
      <input type="text" name="request_type" />
      <textarea name="message"></textarea>
      <input type="text" name="reference" />
      <input type="text" name="timing" />
      <input type="text" name="source_page" />
      <input type="text" name="bot-field" />
    </form>

    <form name="viagem-trovr" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="phone" />
      <input type="text" name="travel_period" />
      <input type="text" name="departure_city" />
      <input type="text" name="travelers" />
      <input type="text" name="trip_length" />
      <input type="text" name="destination_status" />
      <input type="text" name="destination_idea" />
      <input type="text" name="trip_budget" />
      <textarea name="desired_experience"></textarea>
      <input type="text" name="readiness" />
      <input type="text" name="discovery_source" />
      <input type="text" name="source_page" />
      <input type="text" name="offer" />
      <input type="text" name="visual_variant" />
      <input type="text" name="utm_source" />
      <input type="text" name="utm_medium" />
      <input type="text" name="utm_campaign" />
      <input type="text" name="utm_content" />
      <input type="text" name="referrer" />
      <input type="text" name="bot-field" />
    </form>

    <form name="bussola-trovr" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="intent" />
      <input type="text" name="energy" />
      <input type="text" name="source_page" />
      <input type="text" name="bot-field" />
    </form>

    <form name="bussola-interesse" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="email" name="email" />
      <input type="text" name="produto" />
      <input type="text" name="intent" />
      <input type="text" name="energy" />
      <input type="text" name="source_page" />
      <input type="text" name="bot-field" />
    </form>
  </body>
</html>
